; ESP32 + MPU6500 git remo
; Build:   pio run            Upload:  pio run -t upload
; Monitor: pio device monitor (raw protocol lines; use the Python dashboard for graphs)

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino

board_build.f_cpu = 240000000L
monitor_speed = 921600
upload_speed = 921600

build_unflags = -Os
build_flags =
    -O2
    -Wall
    -Wextra
    -DCORE_DEBUG_LEVEL=0
